// DYNAMICZNY GENERATOR: Losuje dokładnie 5 opcji z olbrzymiej puli własności
function generateFormulasPewniak() {
    let trues = shuffle([...megaPoolTrue]);
    let falses = shuffle([...megaPoolFalse]);
    
    let selectedOptions = [trues[0], trues[1], trues[2], falses[0], falses[1]];
    
    return {
        id: 100,
        type: "multi",
        text: "Wybierz zdania zawierające PRAWIDŁOWE stwierdzenia dotyczące podstawowych pochodnych, całek oraz funkcji cyklometrycznych (wraz z ich dziedzinami i zbiorami wartości):",
        options: shuffle(selectedOptions)
    };
}

// Dynamiczny generator pytania o granicę
function generateDynamicLimitQuestion() {
    const signs = [
        { lSign: '+', mSign: '+', ansStr: "5/3" },
        { lSign: '-', mSign: '+', ansStr: "-5/3" },
        { lSign: '+', mSign: '-', ansStr: "-5/3" },
        { lSign: '-', mSign: '-', ansStr: "5/3" }
    ];
    const chosen = signs[Math.floor(Math.random() * signs.length)];
    
    const pool = ["3", "√3", "Ciąg jest rozbieżny", "5", "5/2", "-5", "0"];
    const filteredPool = pool.filter(item => item !== chosen.ansStr);
    
    for (let i = filteredPool.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [filteredPool[i], filteredPool[j]] = [filteredPool[j], filteredPool[i]];
    }

    const options = [
        { text: `lim b_n = ${chosen.ansStr} (Zniekształcony wynik systemowy)`, isCorrect: true },
        { text: `lim b_n = ${filteredPool[0]}`, isCorrect: false },
        { text: `lim b_n = ${filteredPool[1]}`, isCorrect: false },
        { text: `lim b_n = ${filteredPool[2]}`, isCorrect: false }
    ];

    return {
        id: 200,
        type: "single",
        text: `Rozważ ciąg (b_n): b_n = (√(n² ${chosen.lSign} 15) - n) / (√(n² ${chosen.mSign} 3) - n). Wybierz poprawną odpowiedź zgodną z kluczem systemu:`,
        options: options
    };
}

let activeQuizMode = ""; 
let shuffledQuestions = [];
let currentQuestionIndex = 0;
let totalPossiblePoints = 0;
let userTotalPoints = 0;
let isCheckedState = false;
let timerInterval = null;
let timeLeftSeconds = 1200; 

function shuffle(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
}

function formatMathSymbols(text) {
    return text.replace(/(lim a_n|lim \|a_n\||f : A ⟶ R|f⁻¹\(U\)|U ⊂ R|lim_\{x ⟶ x_0\}|f\(x\) = f\(x_0\)|\|a_n\| ≤ b_n|∑ b_n|∑ a_n|b_n =.*?n|lim b_n = \S+|g'\(x\) ≠ 0|lim f\/g = lim f'\/g'|lim_\{x ⟶ a⁺\}|f'\(x\)\/g'\(x\) = K|f\(x\)\/g\(x\) = K|x\^α|α ∈ R|\(x\^α\)'|x\^\{α-1\}|x⁰ = 1|\(x⁰\)' = 0|\(x¹\)'|a_n ⟶ 0|a_n ⇏ 0|∫ \(ln x \/ x\) dx|t = ln x|1\/2\(ln x\)² \+ C|y = φ\(x\)|∫ f\(φ\(x\)\)φ'\(x\) dx = ∫ f\(y\) dy|F\(φ\(x\)\)|x > 0|y, z ∈ R|x\^y < x\^z|0 < x < 1|x\^y > x\^z|Rⁿ|ρ₁, ρ₂, ρ_∞|βρ₁\(x, y\) ≤ ρ₂\(x, y\) ≤ αρ₁\(x, y\)|a > 1|f\(x\) = a\^x|a\^x = 1|f'\(x\) ≥ 0|f'\(x\) < 0|f'\(x\) = 0|f'\(x\) > 0|a_n ≤ a_\{n\+1\}|a_n < a_\{n\+1\}|lim \(a_\{n\+1\} \/ a_n\)|f\(x\) = \w+|\[-1, 1\]|\[-π\/2, π\/2\]|\[0, π\]|\(-π\/2, π\/2\)|1\/\(1\+x²\)|x²|x_0 ∈ \w+|A')/g, '<span class="math-expr">$1</span>');
}

function startQuiz(mode) {
    activeQuizMode = mode;
    document.getElementById('status-panel').style.display = 'flex';
    document.getElementById('btn-action').style.display = 'block';
    
    if (mode === 'full') {
        document.getElementById('main-title').innerText = "Pełna baza pytań";
        document.getElementById('subtitle').innerText = "Tryb ćwiczeniowy - bez limitu czasu";
        document.getElementById('timer-container').style.display = 'none';
        
        shuffledQuestions = [...staticDatabase, generateFormulasPewniak(), generateDynamicLimitQuestion()];
        shuffle(shuffledQuestions);
    } else if (mode === 'colonel') {
        document.getElementById('main-title').innerText = "Test Pana Pułkownika";
        document.getElementById('subtitle').innerText = "Wymagane minimum: 40% do zdania";
        document.getElementById('timer-container').style.display = 'block';
        
        let pool = shuffle([...staticDatabase]);
        let selected = pool.slice(0, 7); 
        selected.push(generateFormulasPewniak()); 
        selected.push(generateDynamicLimitQuestion()); 
        
        shuffledQuestions = shuffle(selected); 
        
        timeLeftSeconds = 1200; 
        startTimer();
    }
    
    currentQuestionIndex = 0;
    userTotalPoints = 0;
    totalPossiblePoints = shuffledQuestions.length; 
    showQuestion();
}

function startTimer() {
    if(timerInterval) clearInterval(timerInterval);
    
    function updateTimerDisplay() {
        let minutes = Math.floor(timeLeftSeconds / 60);
        let seconds = timeLeftSeconds % 60;
        document.getElementById('time-left').innerText = 
            `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        
        if (timeLeftSeconds <= 0) {
            clearInterval(timerInterval);
            alert("Czas minął! System automatycznie kończy Twój egzamin.");
            showFinalResult();
        }
        timeLeftSeconds--;
    }
    
    updateTimerDisplay();
    timerInterval = setInterval(updateTimerDisplay, 1000);
}

function showQuestion() {
    isCheckedState = false;
    const btn = document.getElementById('btn-action');
    btn.innerText = "Sprawdź odpowiedź";
    btn.className = "action-btn btn-check";

    const progress = document.getElementById('progress');
    progress.innerText = `Pytanie ${currentQuestionIndex + 1} z ${shuffledQuestions.length}`;

    const quizArea = document.getElementById('quiz-area');
    quizArea.innerHTML = '';

    const q = shuffledQuestions[currentQuestionIndex];

    const card = document.createElement('div');
    card.className = 'question-card';

    const badge = document.createElement('div');
    badge.className = 'type-badge';
    badge.innerText = q.type === 'multi' ? 'WIELOKROTNY WYBÓR' : 'JEDNOKROTNY WYBÓR';
    card.appendChild(badge);

    const qText = document.createElement('div');
    qText.className = 'question-text';
    qText.innerHTML = formatMathSymbols(q.text);
    card.appendChild(qText);

    const optionsList = document.createElement('ul');
    optionsList.className = 'options-list';

    q.options.forEach(opt => {
        const li = document.createElement('li');
        li.className = 'option-item';

        const input = document.createElement('input');
        input.type = q.type === 'multi' ? 'checkbox' : 'radio';
        input.name = 'quiz-options';
        input.value = opt.text;
        input.dataset.correct = opt.isCorrect;

        const label = document.createElement('span');
        label.className = 'option-text';
        label.innerHTML = formatMathSymbols(opt.text);

        li.appendChild(input);
        li.appendChild(label);

        li.addEventListener('click', (e) => {
            if (!isCheckedState && e.target !== input) {
                if (input.type === 'radio') {
                    const radios = card.querySelectorAll('input[type="radio"]');
                    radios.forEach(r => r.checked = false);
                }
                input.checked = !input.checked;
            }
        });

        optionsList.appendChild(li);
    });

    card.appendChild(optionsList);
    quizArea.appendChild(card);
}

function handleAction() {
    if (!isCheckedState) {
        checkCurrentAnswer();
    } else {
        nextQuestion();
    }
}

function checkCurrentAnswer() {
    const card = document.querySelector('.question-card');
    const inputs = card.querySelectorAll('input');
    
    let anyChecked = false;
    inputs.forEach(i => { if(i.checked) anyChecked = true; });
    if(!anyChecked) {
        alert("Zaznacz co najmniej jedną odpowiedź!");
        return;
    }

    let anyIncorrectChecked = false;
    let correctCheckedCount = 0;
    let totalCorrectCount = 0;

    inputs.forEach(input => {
        const isCorrectAnswer = input.dataset.correct === 'true';
        const isChecked = input.checked;

        if (isCorrectAnswer) totalCorrectCount++;

        if (isChecked && !isCorrectAnswer) anyIncorrectChecked = true;
        if (isChecked && isCorrectAnswer) correctCheckedCount++;
    });

    inputs.forEach(input => {
        const item = input.closest('.option-item');
        const isCorrectAnswer = input.dataset.correct === 'true';
        const isChecked = input.checked;

        input.disabled = true;

        if (isChecked && isCorrectAnswer) {
            item.classList.add('correct');
        } else if (isChecked && !isCorrectAnswer) {
            item.classList.add('incorrect');
        } else if (!isChecked && isCorrectAnswer) {
            item.classList.add('missing');
        }
    });

    let pointsEarned = 0;
    if (anyIncorrectChecked) {
        pointsEarned = 0; 
    } else {
        if (totalCorrectCount > 0) {
            pointsEarned = correctCheckedCount / totalCorrectCount;
        }
    }

    userTotalPoints += pointsEarned;

    isCheckedState = true;
    const btn = document.getElementById('btn-action');
    btn.innerText = "Następne pytanie";
    btn.className = "action-btn btn-next";
}

function nextQuestion() {
    currentQuestionIndex++;
    if (currentQuestionIndex < shuffledQuestions.length) {
        showQuestion();
    } else {
        showFinalResult();
    }
}

function showFinalResult() {
    if(timerInterval) clearInterval(timerInterval);
    
    document.getElementById('status-panel').style.display = 'none';
    const quizArea = document.getElementById('quiz-area');
    const btn = document.getElementById('btn-action');
    btn.style.display = 'none';

    let finalPoints = Math.round(userTotalPoints * 100) / 100;
    let percentage = Math.round((finalPoints / totalPossiblePoints) * 100);
    
    let passStatusHTML = "";
    if (activeQuizMode === 'colonel') {
        if (percentage >= 40) {
            passStatusHTML = `<br><span class="result-badge passed">ZALICZONY (Zdano od 40%)</span>`;
        } else {
            passStatusHTML = `<br><span class="result-badge failed">NIEZALICZONY (Wymagane minimum 40%)</span>`;
        }
    }

    quizArea.innerHTML = `
        <div class="score-summary">
            Koniec testu!<br><br>
            Uzyskane punkty:<br>
            <span style="font-size: 1.6em; color: #2563eb;">${finalPoints} / ${totalPossiblePoints} p.</span><br>
            Procentowy wynik: <span style="font-weight:bold;">${percentage}%</span>
            ${passStatusHTML}
            <br>
            <button class="btn-restart" onclick="location.reload()">Powrót do wyboru trybu</button>
        </div>
    `;
}
